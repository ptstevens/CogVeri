<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="50%" style="stop-color:#764ba2"/>
      <stop offset="100%" style="stop-color:#f093fb"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ff9a9e;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%">
      <stop offset="0%" style="stop-color:#a18cd1;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#a18cd1;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="80%" cy="20%">
      <stop offset="0%" style="stop-color:#fbc2eb;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#fbc2eb;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <!-- Base gradient -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Glowing orbs -->
  <ellipse cx="300" cy="250" rx="350" ry="300" fill="url(#glow1)"/>
  <ellipse cx="900" cy="500" rx="400" ry="350" fill="url(#glow2)"/>
  <ellipse cx="1000" cy="150" rx="300" ry="250" fill="url(#glow3)"/>
  <!-- Geometric shapes -->
  <circle cx="200" cy="600" r="80" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="100" r="60" fill="rgba(255,255,255,0.1)"/>
  <polygon points="640,100 700,200 580,200" fill="rgba(255,255,255,0.08)"/>
  <rect x="50" y="300" width="100" height="100" rx="10" fill="rgba(255,255,255,0.05)" transform="rotate(15 100 350)"/>
</svg>
