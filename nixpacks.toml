# Nixpacks configuration for Relay Backend (Monorepo)
# This file should be at the root of the monorepo

[phases.setup]
nixPkgs = ["nodejs"]

[phases.install]
# Install dependencies - using workspaces to install backend deps
cmds = [
  "npm install --include=dev"
]

[phases.build]
# Build the backend workspace
cmds = [
  "npm run build:backend"
]

[start]
# Start the backend service with migrations
cmd = "cd backend && npm run start:migrate"
