name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🔐 Logging into GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            IMAGE="ghcr.io/${{ github.repository }}/backend:latest"

            echo "📥 Pulling latest image..."
            docker pull $IMAGE

            echo "🔄 Stopping current container..."
            docker stop cogveri-backend || true
            docker rm cogveri-backend || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name cogveri-backend \
              --restart unless-stopped \
              --env-file /opt/cogveri/.env \
              -p 3000:3000 \
              --network cogveri-net \
              $IMAGE

            echo "⏳ Waiting for health check..."
            sleep 10
            if curl -f http://localhost:3000/health; then
              echo "✅ Deploy successful!"
            else
              echo "❌ Health check failed — rolling back"
              docker stop cogveri-backend || true
              docker rm cogveri-backend || true
              docker run -d \
                --name cogveri-backend \
                --restart unless-stopped \
                --env-file /opt/cogveri/.env \
                -p 3000:3000 \
                --network cogveri-net \
                ghcr.io/${{ github.repository }}/backend:previous
              exit 1
            fi

            echo "🏷️ Tagging as previous (for rollback)"
            docker tag $IMAGE ghcr.io/${{ github.repository }}/backend:previous

            echo "🧹 Pruning old images..."
            docker image prune -f
