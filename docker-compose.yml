version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: relay-postgres
    environment:
      POSTGRES_DB: relay_db
      POSTGRES_USER: relay_user
      POSTGRES_PASSWORD: relay_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - relay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_user -d relay_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: relay-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://relay_user:relay_password@postgres:5432/relay_db
      JWT_SECRET: your-jwt-secret-key-change-in-production
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      # AWS S3 Configuration (update with your values)
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: your-access-key
      AWS_SECRET_ACCESS_KEY: your-secret-key
      AWS_S3_BUCKET: relay-recordings
      # SSO Configuration (update with your values)
      SSO_ENTRY_POINT: https://your-sso-provider.com/sso
      SSO_ISSUER: relay-app
      SSO_CALLBACK_URL: http://localhost:3000/api/auth/callback
      # Slack Configuration (optional)
      SLACK_WEBHOOK_URL: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
    volumes:
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - relay-network
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder
    container_name: relay-frontend
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_SOCKET_URL: http://localhost:3000
      VITE_APP_NAME: Relay
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/package.json:/app/package.json
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - relay-network
    command: npm run dev -- --host

  # Optional: MinIO for local S3-compatible storage
  minio:
    image: minio/minio:latest
    container_name: relay-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - relay-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Optional: Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: relay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - relay-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  relay-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules: