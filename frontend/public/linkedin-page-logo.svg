<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#0F766E"/>
    </linearGradient>
    <!-- Subtle pattern -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="24" fill="url(#bgGradient)"/>
  <rect width="300" height="300" rx="24" fill="url(#grid)"/>

  <!-- Cog/Gear icon representing "Cog" in CogVeri -->
  <g transform="translate(150, 130)">
    <!-- Outer cog teeth -->
    <path d="M0,-70 L8,-68 L12,-58 L20,-60 L28,-52 L24,-44 L32,-38 L40,-44 L50,-38 L44,-28 L52,-22 L58,-28 L66,-18 L58,-12 L60,-2 L68,0 L68,12 L60,14 L58,24 L66,30 L58,40 L50,34 L44,44 L52,52 L40,58 L32,50 L24,56 L28,66 L16,68 L12,58 L0,62 L-12,58 L-16,68 L-28,66 L-24,56 L-32,50 L-40,58 L-52,52 L-44,44 L-50,34 L-58,40 L-66,30 L-58,24 L-60,14 L-68,12 L-68,0 L-60,-2 L-58,-12 L-66,-18 L-58,-28 L-52,-22 L-44,-28 L-50,-38 L-40,-44 L-32,-38 L-24,-44 L-28,-52 L-20,-60 L-12,-58 L-8,-68 Z"
          fill="white" opacity="0.95"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="28" fill="url(#bgGradient)"/>
    <!-- Center play button / checkmark hybrid -->
    <path d="M-8,-12 L12,0 L-8,12 Z" fill="white" opacity="0.9"/>
  </g>

  <!-- "CogVeri" text -->
  <text x="150" y="230"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="36"
        font-weight="700"
        fill="white"
        text-anchor="middle"
        letter-spacing="1">CogVeri</text>

  <!-- Tagline -->
  <text x="150" y="260"
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="14"
        font-weight="400"
        fill="rgba(255,255,255,0.8)"
        text-anchor="middle"
        letter-spacing="0.5">Video Verification Platform</text>
</svg>
